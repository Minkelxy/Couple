name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -q

      - name: Compile sources
        run: python -m compileall -q DesktopMailbox relay_server.py tests

  relay-runtime:
    name: Ubuntu relay / Gunicorn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install relay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r relay-requirements.txt

      - name: Validate Gunicorn application
        env:
          COUPLE_RELAY_DB: ${{ runner.temp }}/couple-relay/letters.db
        run: gunicorn --check-config --bind 127.0.0.1:5000 relay_server:app
