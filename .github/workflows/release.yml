name: Build & Release Windows exe

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，如 v0.1.0（留空则用当前 HEAD）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (onedir)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow-avif-plugin

      - name: Build
        run: python -m PyInstaller couple_suite.spec --noconfirm

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = "dist/CoupleSuite/CoupleSuite.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }
          $file = Get-Item $exe
          if ($file.Length -le 0) {
            throw "Packaged executable is empty: $exe"
          }
          Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"

      - name: Show dist
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Compress zip
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } elseif ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "latest" }
          Compress-Archive -Path dist/CoupleSuite -DestinationPath "CoupleSuite-$ver-windows-x64.zip" -Force
          Get-ChildItem *.zip | Select-Object FullName, Length

      - name: Create Release + Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CoupleSuite-*-windows-x64.zip
          name: CoupleSuite ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
